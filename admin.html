<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080D18">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>try{if(localStorage.getItem("fh.size")==="large")document.documentElement.dataset.size="large"}catch(e){}</script>
<title>Admin · Flawed Hero</title>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="back" href="./">&larr; Home</a>
  <h1>Admin</h1>
</div></header>
<main class="wrap">
  <div class="seg" id="tabs"><button data-v="members" aria-pressed="true">Members</button><button data-v="claims" aria-pressed="false" id="ctab">Approvals</button><button data-v="queue" aria-pressed="false" id="qtab">Queue</button><button data-v="info" aria-pressed="false">Overview</button></div>

  <section id="members">
    <div class="chips" style="display:flex;gap:6px;margin-bottom:12px" id="mf"></div>
    <div id="mlist" style="display:flex;flex-direction:column;gap:12px"></div>
  </section>

  <section id="claims" hidden>
    <h3 style="font-size:18px;margin-bottom:8px">Marathon bookings</h3>
    <p class="note" id="enote" style="margin-bottom:8px"></p>
    <div id="elist" style="display:flex;flex-direction:column;gap:12px;margin-bottom:18px"></div>
    <h3 style="font-size:18px;margin-bottom:8px">Message board posts</h3>
    <div id="plist" style="display:flex;flex-direction:column;gap:12px;margin-bottom:18px"></div>
    <h3 style="font-size:18px;margin-bottom:8px">Diary events</h3>
    <div id="dlist" style="display:flex;flex-direction:column;gap:12px;margin-bottom:18px"></div>
    <h3 style="font-size:18px;margin-bottom:8px">New charities</h3>
    <div id="chlist" style="display:flex;flex-direction:column;gap:12px;margin-bottom:18px"></div>
    <h3 style="font-size:18px;margin-bottom:8px">Medal claims</h3>
    <div id="clist" style="display:flex;flex-direction:column;gap:12px"></div>
  </section>

  <section id="info" hidden>
    <div class="card"><b>Management information</b><div id="stats" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div>
    <p class="note">More reports will be added here as we work out what you need.</p></div>
  </section>

  <section id="queue" hidden>
    <form class="card" id="idea" style="margin-bottom:12px">
      <b>Add your own idea</b>
      <label class="f">Idea in a few words<input type="text" id="it" maxlength="120" required></label>
      <label class="f">More detail (optional)<textarea id="ib" maxlength="1000" style="min-height:80px"></textarea></label>
      <label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="ipriv" checked style="width:22px;height:22px"> Private: only I can see it</label>
      <div class="btns"><button class="btn" id="isend">Add to the queue</button></div>
      <p class="note" id="imsg" hidden></p>
    </form>
    <div id="qlist" style="display:flex;flex-direction:column;gap:12px"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/charities.js"></script>
<script>
const $ = id => document.getElementById(id);
let me = null, mfilter = 'pending', members = [], events = [], results = [];
const ROLE_LABEL = { admin: 'Admin', super: 'Super user', member: 'Member' };

// Michael (admin) manages everything. Super users (Phil) can approve members but not change roles or the queue.
guard({ staff: true }).then(p => {
  if (!p) return; me = p;
  // Super user (Phil) sees the queue read-only; private items, roles and queue changes stay with the admin
  if (!isAdmin(p)) $('idea').hidden = true;
  tab(location.hash === '#queue' ? 'queue' : location.hash === '#claims' ? 'claims' : 'members');
  loadMembers(); loadQueue(); loadStats();
});
function tab(v) {
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  $('members').hidden = v !== 'members'; $('queue').hidden = v !== 'queue'; $('info').hidden = v !== 'info'; $('claims').hidden = v !== 'claims';
}
$('tabs').onclick = e => { if (e.target.dataset.v) tab(e.target.dataset.v); };

/* ---------- Members ---------- */
async function loadMembers() {
  const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
  if (error) { $('mlist').innerHTML = '<p class="err">' + esc(error.message) + '</p>'; return; }
  members = data;
  const [ev, rs] = await Promise.all([sb.from('events').select('*').order('sort'), sb.from('results').select('*')]);
  events = ev.data || []; results = rs.data || [];
  drawMembers(); drawClaims(); loadCharities(); loadDiary(); loadPosts();
}
const evName = id => (events.find(e => e.id === id) || { name: id }).name;
function drawMembers() {
  const counts = { pending: 0, approved: 0, blocked: 0 }; members.forEach(m => counts[m.status]++);
  $('mf').innerHTML = ['pending', 'approved', 'blocked'].map(s =>
    '<button class="btn ' + (s === mfilter ? '' : 'ghost') + '" style="min-height:38px;padding:4px 14px" data-f="' + s + '">' + s[0].toUpperCase() + s.slice(1) + ' (' + counts[s] + ')</button>').join('');
  const rows = members.filter(m => m.status === mfilter);
  $('mlist').innerHTML = rows.length ? rows.map(m =>
    '<article class="card mem" data-id="' + m.user_id + '"><div class="row"><b>' + esc(m.name || '(no name)') + '</b><span class="chip st-' + m.status + '">' + ROLE_LABEL[m.role] + '</span></div>' +
    '<small class="muted">' + esc(m.email) + (m.phone ? ' &middot; ' + esc(m.phone) : '') + ' &middot; joined ' + ago(m.created_at) + '</small>' +
    (m.kin_name ? '<small class="muted">Next of kin: ' + esc(m.kin_name) + (m.kin_relationship ? ' (' + esc(m.kin_relationship) + ')' : '') + ' ' + esc(m.kin_phone) + '</small>' : '') +
    (m.hero_story ? '<p class="muted" style="white-space:pre-wrap">' + esc(m.hero_story) + '</p><small class="muted">Story: ' + (m.hero_story_choice === 'rework' ? 'wants us to rework it' : m.hero_story_choice === 'own' ? 'keep in own words' : 'not chosen yet') + '</small>' : '') +
    (m.status === 'approved' ? medalsBlock(m) : '') +
    '<div class="adm">' +
      (m.status !== 'approved' ? '<button class="btn" data-a="approved">Approve</button>' : '') +
      (m.status !== 'blocked' && m.user_id !== me.user_id ? '<button class="btn ghost" data-a="blocked">Block</button>' : '') +
      (m.status === 'blocked' ? '<button class="btn ghost" data-a="pending">Back to waiting</button>' : '') +
      (isAdmin(me) && m.user_id !== me.user_id ? '<select data-role aria-label="Role">' + ['member', 'super', 'admin'].map(r => '<option value="' + r + '"' + (r === m.role ? ' selected' : '') + '>' + ROLE_LABEL[r] + '</option>').join('') + '</select>' : '') +
    '</div></article>').join('') : '<p class="ph">Nobody here.</p>';
}
let pendingClaims = 0, pendingCharities = 0, pendingDiary = 0, pendingEntries = 0, pendingPosts = 0, charities = [];
const tabCount = () => { const n = pendingClaims + pendingCharities + pendingDiary + pendingEntries + pendingPosts; $('ctab').textContent = n ? 'Approvals (' + n + ')' : 'Approvals'; };

// Message board posts from members (staff approve)
async function loadPosts() {
  const { data, error } = await sb.from('posts').select('*').eq('status', 'pending').order('created_at');
  if (error) { $('plist').innerHTML = '<p class="err">' + esc(error.message) + '</p>'; return; }
  pendingPosts = data.length; tabCount();
  $('plist').innerHTML = data.length ? data.map(x =>
    '<article class="card mem" data-pid="' + x.id + '"><div class="row"><b>' + esc(x.author_name || 'A member') + '</b><span class="chip">' + ago(x.created_at) + '</span></div>' +
    '<p style="white-space:pre-wrap">' + esc(x.body) + '</p><div class="adm"><button class="btn" data-pok>Approve</button><button class="btn ghost" data-pno>Reject</button></div></article>').join('')
    : '<p class="ph">No messages waiting.</p>';
}
$('plist').onclick = async e => {
  const ok = e.target.matches('[data-pok]'), no = e.target.matches('[data-pno]'); if (!ok && !no) return;
  e.target.disabled = true;
  const { error } = await sb.from('posts').update({ status: ok ? 'approved' : 'rejected', decided_by: me.user_id, decided_at: new Date().toISOString() }).eq('id', +e.target.closest('.card').dataset.pid);
  if (error) { alert(error.message); e.target.disabled = false; return; }
  loadPosts();
};

// Diary events (staff approve) and marathon bookings (ONLY Phil, the super user, can approve those)
async function loadDiary() {
  const [dv, en] = await Promise.all([sb.from('diary_events').select('*').order('starts_at'), sb.from('marathon_entries').select('*').order('created_at')]);
  const events = dv.data || [], entries = en.data || [];
  const pendEv = events.filter(x => x.status === 'pending'), pendEn = entries.filter(x => x.status === 'pending');
  pendingDiary = pendEv.length; pendingEntries = me.role === 'super' ? pendEn.length : 0; tabCount();
  const isPhil = me.role === 'super';
  $('enote').textContent = isPhil ? 'Check the payment has arrived before you approve.' : 'Phil approves these. You can see who is waiting.';
  const mar = events.find(x => x.kind === 'marathon');
  $('elist').innerHTML = pendEn.length ? pendEn.map(r => {
    const m = members.find(x => x.user_id === r.user_id) || { name: '(unknown)' };
    return '<article class="card mem" data-uid="' + r.user_id + '" data-eid="' + r.event_id + '"><div class="row"><b>' + esc(m.name || m.email) + '</b><span class="chip">' + ago(r.created_at) + '</span></div>' +
      '<p class="muted">Says they are booked on and paid for ' + esc(mar ? mar.title : 'the marathon') + '</p>' +
      (isPhil ? '<div class="adm"><button class="btn" data-eok>Confirm</button><button class="btn ghost" data-eno>Not confirmed</button></div>' : '') + '</article>';
  }).join('') : '<p class="ph">No bookings waiting.</p>';
  $('dlist').innerHTML = pendEv.length ? pendEv.map(x => {
    const by = members.find(m => m.user_id === x.created_by);
    return '<article class="card mem" data-did="' + x.id + '"><div class="row"><b>' + esc(x.title) + '</b><span class="chip">' + ago(x.created_at) + '</span></div>' +
      '<p>' + new Date(x.starts_at).toLocaleString('en-GB', { dateStyle: 'full', timeStyle: x.all_day ? undefined : 'short' }) + (x.location ? ' &middot; ' + esc(x.location) : '') + '</p>' +
      (x.description ? '<p class="muted">' + esc(x.description) + '</p>' : '') + '<small class="muted">Suggested by ' + esc(by ? by.name : 'a member') + '</small>' +
      '<div class="adm"><button class="btn" data-dok>Approve</button><button class="btn ghost" data-dno>Reject</button></div></article>';
  }).join('') : '<p class="ph">No events waiting.</p>';
}
$('elist').onclick = async e => {
  const ok = e.target.matches('[data-eok]'), no = e.target.matches('[data-eno]'); if (!ok && !no) return;
  const c = e.target.closest('.card'); e.target.disabled = true;
  const { error } = await sb.from('marathon_entries').update({ status: ok ? 'approved' : 'rejected', decided_by: me.user_id, decided_at: new Date().toISOString() }).eq('user_id', c.dataset.uid).eq('event_id', +c.dataset.eid);
  if (error) { alert(error.message); e.target.disabled = false; return; }
  loadDiary(); loadStats();
};
$('dlist').onclick = async e => {
  const ok = e.target.matches('[data-dok]'), no = e.target.matches('[data-dno]'); if (!ok && !no) return;
  e.target.disabled = true;
  const { error } = await sb.from('diary_events').update({ status: ok ? 'approved' : 'rejected', decided_by: me.user_id, decided_at: new Date().toISOString() }).eq('id', +e.target.closest('.card').dataset.did);
  if (error) { alert(error.message); e.target.disabled = false; return; }
  loadDiary();
};

// New charities: staff check the name and logo, then approve (they join the network) or reject
async function loadCharities() {
  const { data, error } = await sb.from('charities').select('*').eq('status', 'pending').order('created_at');
  if (error) { $('chlist').innerHTML = '<p class="err">' + esc(error.message) + '</p>'; return; }
  charities = data; pendingCharities = data.length; tabCount();
  $('chlist').innerHTML = data.length ? data.map(c => {
    const by = members.find(m => m.user_id === c.created_by), w = safeUrl(c.website);
    return '<article class="card mem" data-cid="' + c.id + '"><div class="row" style="justify-content:flex-start;gap:14px;align-items:center">' + logoTile(c, true) +
      '<div style="flex:1;min-width:0"><b>' + esc(c.name) + '</b><br><small class="muted">Added by ' + esc(by ? by.name : 'a member') + ' &middot; ' + ago(c.created_at) + '</small></div></div>' +
      (c.description ? '<p class="muted">' + esc(c.description) + '</p>' : '') +
      (w ? '<p><a href="' + esc(w) + '" target="_blank" rel="noopener">' + esc(w) + '</a></p>' : '') +
      '<div class="adm"><button class="btn" data-cok>Approve</button><button class="btn ghost" data-cno>Reject</button>' +
      '<label class="btn ghost" style="cursor:pointer">Replace logo<input type="file" accept="image/*" data-clogo hidden></label></div></article>';
  }).join('') : '<p class="ph">No charities waiting.</p>';
}
$('chlist').onclick = async e => {
  const ok = e.target.matches('[data-cok]'), no = e.target.matches('[data-cno]'); if (!ok && !no) return;
  const id = +e.target.closest('.card').dataset.cid; e.target.disabled = true;
  const { error } = await sb.from('charities').update({ status: ok ? 'approved' : 'rejected', decided_by: me.user_id, decided_at: new Date().toISOString() }).eq('id', id);
  if (error) { alert(error.message); e.target.disabled = false; return; }
  loadCharities();
};
$('chlist').onchange = async e => {
  if (!e.target.matches('[data-clogo]')) return;
  const f = e.target.files[0]; if (!f) return;
  const id = +e.target.closest('.card').dataset.cid;
  try {
    const path = await uploadLogo(f, me.user_id);
    const { error } = await sb.from('charities').update({ logo_path: path }).eq('id', id);
    if (error) throw error;
    loadCharities();
  } catch (err) { alert('Couldn\u2019t replace the logo: ' + err.message); }
};

// Claims: members say "I did this"; staff approve or reject
function drawClaims() {
  const pend = results.filter(r => r.status === 'pending').sort((x, y) => new Date(x.created_at) - new Date(y.created_at));
  pendingClaims = pend.length; tabCount();
  $('clist').innerHTML = pend.length ? pend.map(r => {
    const m = members.find(x => x.user_id === r.user_id) || { name: '(unknown)' };
    return '<article class="card mem" data-rid="' + r.id + '"><div class="row"><b>' + esc(m.name || m.email) + '</b><span class="chip">' + ago(r.created_at) + '</span></div>' +
      '<p>' + esc(evName(r.event_id)) + ' ' + r.year + '</p>' + (r.note ? '<p class="muted">' + esc(r.note) + '</p>' : '') +
      '<div class="adm"><button class="btn" data-ok>Approve</button><button class="btn ghost" data-no>Reject</button></div></article>';
  }).join('') : '<p class="ph">No medal claims waiting.</p>';
}
$('clist').onclick = async e => {
  const ok = e.target.matches('[data-ok]'), no = e.target.matches('[data-no]'); if (!ok && !no) return;
  const id = +e.target.closest('.card').dataset.rid; e.target.disabled = true;
  const { error } = await sb.from('results').update({ status: ok ? 'approved' : 'rejected', decided_by: me.user_id, decided_at: new Date().toISOString() }).eq('id', id);
  if (error) { alert(error.message); e.target.disabled = false; return; }
  results.find(r => r.id === id).status = ok ? 'approved' : 'rejected'; drawClaims(); drawMembers();
};

// Medals: staff (Michael, Phil) record completed events; the Hero's Cabinet fills in from these
function medalsBlock(m) {
  const mine = results.filter(r => r.user_id === m.user_id && r.status === 'approved');
  return '<div class="adm" style="flex-direction:column;align-items:stretch"><b style="font-size:.95em">Medals</b>' +
    '<div style="display:flex;flex-wrap:wrap;gap:6px">' + (mine.length ? mine.map(r => '<span class="chip">' + esc(evName(r.event_id)) + ' ' + r.year +
      ' <button data-rm="' + r.id + '" aria-label="Remove" style="background:none;border:0;color:inherit;cursor:pointer;font-size:1.1em;padding:0 0 0 4px">&times;</button></span>').join('') : '<small class="muted">None yet</small>') + '</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><select data-ev aria-label="Event">' + events.map(e => '<option value="' + e.id + '">' + esc(e.name) + '</option>').join('') + '</select>' +
    '<input type="number" data-yr min="2000" max="2100" value="' + new Date().getFullYear() + '" style="width:90px;min-height:40px;padding:6px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink)" aria-label="Year">' +
    '<button class="btn" data-award style="min-height:40px">Award</button></div></div>';
}
$('mf').onclick = e => { if (e.target.dataset.f) { mfilter = e.target.dataset.f; drawMembers(); } };
$('mlist').onclick = async e => {
  const card = e.target.closest('.card');
  if (e.target.closest('[data-award]')) {
    const uid = card.dataset.id, ev = card.querySelector('[data-ev]').value, yr = +card.querySelector('[data-yr]').value;
    const { data, error } = await sb.from('results').insert({ user_id: uid, event_id: ev, year: yr }).select().single();
    if (error) return alert(/duplicate|unique/i.test(error.message) ? 'They already have that Flawed Hero Marathon year.' : error.message);
    results.push(data); drawMembers(); return;
  }
  const rm = e.target.closest('[data-rm]');
  if (rm) {
    if (!confirm('Remove this medal?')) return;
    const { error } = await sb.from('results').delete().eq('id', +rm.dataset.rm);
    if (error) return alert(error.message);
    results = results.filter(r => r.id !== +rm.dataset.rm); drawMembers(); return;
  }
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const m = members.find(x => x.user_id === b.closest('.card').dataset.id);
  b.disabled = true;
  const { error } = await sb.rpc('set_member', { p_user: m.user_id, p_status: b.dataset.a, p_role: null });
  if (error) { alert(error.message); b.disabled = false; return; }
  m.status = b.dataset.a; drawMembers();
};
$('mlist').onchange = async e => {
  if (!e.target.matches('select[data-role]')) return;
  const m = members.find(x => x.user_id === e.target.closest('.card').dataset.id);
  const { error } = await sb.rpc('set_member', { p_user: m.user_id, p_status: null, p_role: e.target.value });
  if (error) { alert(error.message); e.target.value = m.role; return; }
  m.role = e.target.value; drawMembers();
};

/* ---------- Overview (management information, first cut) ---------- */
async function loadStats() {
  const cnt = async (t, f) => { let q = sb.from(t).select('*', { count: 'exact', head: true }); if (f) q = f(q); const { count } = await q; return count || 0; };
  const pub = q => q.eq('is_private', false);
  const [mAll, mOk, mPend, mBlock, rAll, rOpen, rDone, entrants] = await Promise.all([
    cnt('profiles'), cnt('profiles', q => q.eq('status', 'approved')), cnt('profiles', q => q.eq('status', 'pending')), cnt('profiles', q => q.eq('status', 'blocked')),
    cnt('requests', pub), cnt('requests', q => pub(q).in('status', ['suggested', 'accepted', 'planned', 'building'])), cnt('requests', q => pub(q).eq('status', 'done')), cnt('marathon_entries', q => q.eq('status', 'approved'))]);
  const box = (n, l) => '<div class="card" style="padding:12px"><b style="font-family:var(--head);font-size:30px;color:var(--gold)">' + n + '</b><small class="muted">' + l + '</small></div>';
  $('stats').innerHTML = box(mAll, 'Registered') + box(mOk, 'Approved') + box(mPend, 'Waiting for approval') + box(mBlock, 'Blocked') +
    box(rAll, 'Suggestions') + box(rOpen, 'Still open') + box(rDone, 'Done') + box(entrants, 'Marathon entrants (confirmed)');
}

/* ---------- Development queue ---------- */
// Your own ideas go straight in as Accepted (members' suggestions arrive as Suggested)
$('idea').onsubmit = async e => {
  e.preventDefault(); $('isend').disabled = true; $('imsg').hidden = true;
  const ins = await sb.from('requests').insert({ title: $('it').value.trim(), body: $('ib').value.trim(), is_private: $('ipriv').checked }).select().single();
  if (ins.error) { $('imsg').textContent = ins.error.message; $('imsg').hidden = false; $('isend').disabled = false; return; }
  await sb.from('requests').update({ status: 'accepted', updated_at: new Date().toISOString() }).eq('id', ins.data.id);
  $('idea').reset(); $('ipriv').checked = true; $('isend').disabled = false; loadQueue();
};
const QORDER = { suggested:0, accepted:1, planned:2, building:3, later:4, done:5, denied:6 };
let reqs = [];
async function loadQueue() {
  const { data, error } = await sb.from('requests').select('*');
  if (error) { $('qlist').innerHTML = '<p class="err">' + esc(error.message) + '</p>'; return; }
  reqs = data.sort((a, b) => (QORDER[a.status] - QORDER[b.status]) || ((a.priority || 999) - (b.priority || 999)) || (new Date(b.created_at) - new Date(a.created_at)));
  drawQueue();
}
function drawQueue() {
  $('qlist').innerHTML = reqs.length ? reqs.map(r =>
    '<article class="card req" data-id="' + r.id + '"><div class="row"><b>' + esc(r.title) + '</b>' + (r.is_private ? '<span class="chip" style="background:var(--red);color:#fff">Private</span>' : '') + '<span class="chip s-' + r.status + '">' + STATUS[r.status] + '</span></div>' +
    (r.body ? '<p class="muted">' + esc(r.body) + '</p>' : '') +
    '<small class="muted">' + esc(r.author_name) + ' &middot; ' + ago(r.created_at) + '</small>' +
    (isAdmin(me) ? '<div class="adm"><select data-f="status" aria-label="Status">' + Object.keys(STATUS).map(s => '<option value="' + s + '"' + (s === r.status ? ' selected' : '') + '>' + STATUS[s] + '</option>').join('') + '</select>' +
    '<input type="number" min="1" max="99" data-f="priority" placeholder="#" value="' + (r.priority || '') + '" aria-label="Priority order">' +
    '<input type="text" data-f="reply" placeholder="Reply to the member (optional)" maxlength="300" value="' + esc(r.reply || '') + '" style="flex-basis:100%;min-height:40px">' +
    '<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-f="is_private"' + (r.is_private ? ' checked' : '') + ' style="width:20px;height:20px"> Private</label>' +
    '<button class="btn" data-save>Save</button><button class="btn ghost" data-del>Delete</button></div>' : '') + '</article>').join('') : '<p class="ph">No suggestions yet.</p>';
}
$('qlist').onclick = async e => {
  const card = e.target.closest('.card'); if (!card) return;
  const id = +card.dataset.id;
  if (e.target.matches('[data-del]')) {
    if (!confirm('Delete this suggestion for good?')) return;
    const { error } = await sb.from('requests').delete().eq('id', id);
    if (error) return alert(error.message);
    reqs = reqs.filter(r => r.id !== id); drawQueue(); return;
  }
  if (e.target.matches('[data-save]')) {
    const get = f => card.querySelector('[data-f="' + f + '"]').value;
    const row = { is_private: card.querySelector('[data-f="is_private"]').checked, status: get('status'), priority: get('priority') ? +get('priority') : null, reply: get('reply').trim() || null, updated_at: new Date().toISOString() };
    e.target.disabled = true;
    const { error } = await sb.from('requests').update(row).eq('id', id);
    e.target.disabled = false;
    if (error) return alert(error.message);
    Object.assign(reqs.find(r => r.id === id), row); e.target.textContent = 'Saved';
    setTimeout(() => { reqs.sort((a, b) => (QORDER[a.status] - QORDER[b.status]) || ((a.priority || 999) - (b.priority || 999))); drawQueue(); }, 700);
  }
};
</script>
</body>
</html>
