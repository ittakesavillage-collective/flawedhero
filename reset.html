<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080D18">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<title>New password · Flawed Hero</title>
</head>
<body>
<main class="wrap" style="padding-top:calc(24px + env(safe-area-inset-top,0px))">
  <img class="authlogo" src="icons/icon-192.png" alt="Flawed Hero">
  <div class="center"><h1>Choose a new password</h1></div>
  <section class="card" id="wait"><p class="muted">Checking your link...</p></section>
  <section class="card" id="bad" hidden><b>That link has expired or been used</b><p class="muted">Go back to the sign-in page and ask for a new one.</p><div class="btns"><a class="btn" href="login.html">Back to sign in</a></div></section>
  <section class="card" id="ok" hidden>
    <form id="form" style="display:flex;flex-direction:column;gap:12px">
      <label class="f">New password<input type="password" id="pw" autocomplete="new-password" minlength="8" required></label>
      <p class="note">At least 8 characters.</p>
      <div class="btns"><button class="btn" id="go">Save new password</button></div>
      <p class="err" id="msg" hidden></p>
    </form>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script>
const $ = id => document.getElementById(id);
let shown = false;
const show = id => { ['wait', 'bad', 'ok'].forEach(k => $(k).hidden = k !== id); shown = true; };
// The email link signs the person in for password recovery; the sign-in library tells us when that has happened
sb.auth.onAuthStateChange((event, session) => { if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) show('ok'); });
setTimeout(async () => { if (!shown) { const u = await currentUser(); show(u ? 'ok' : 'bad'); } }, 2500);
$('form').onsubmit = async e => {
  e.preventDefault(); $('go').disabled = true; $('msg').hidden = true;
  const { error } = await sb.auth.updateUser({ password: $('pw').value });
  $('go').disabled = false;
  if (error) { $('msg').textContent = error.message; $('msg').hidden = false; return; }
  $('ok').innerHTML = '<b>Password changed</b><p class="muted">You are signed in.</p><div class="btns"><a class="btn" href="./">Open Flawed Hero</a></div>';
};
</script>
</body>
</html>
