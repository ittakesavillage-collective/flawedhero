<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080D18">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flawed Hero">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>try{if(localStorage.getItem("fh.size")==="large")document.documentElement.dataset.size="large"}catch(e){}</script>
<title>Flawed Hero</title>
</head>
<body>
<div id="splash" role="img" aria-label="The Flawed Hero Marathon 2027. Flawed. Not Broken."></div>
<header class="bar"><div class="bar-in">
  <a class="brand" href="./"><img src="icons/icon-192.png" alt="" width="38" height="38"><span>Flawed Hero</span></a>
  <!-- ! = admin and super user (Phil); + = everyone (the development queue). -->
  <a class="ib" id="bell" href="notifications.html" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.500 2h-15zM10 21h4"/></svg><span class="dot" id="bdot" hidden></span></a>
  <a class="ib admin" id="adm" href="admin.html" aria-label="Admin" hidden>!<span class="dot" id="dot" hidden></span></a>
  <a class="ib plus" id="plus" href="queue.html" aria-label="Development queue and suggestions" hidden>+</a>
  <a class="ib" href="settings.html" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  <a class="ib" href="about.html" aria-label="About us"><svg viewBox="0 0 24 24" aria-hidden="true" style="fill:none"><path d="M2 15l4.5-4.5L11 15" stroke="#4A7C59" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 12.5l5-6 5 6" stroke="#D96B43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 15l4.5-4.5L22 15" stroke="#E8A838" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="17.5" r="2" fill="#E8A838"/></svg></a>
</div></header>

<main class="wrap">
  <a class="banner" id="inst" href="install.html" hidden>
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    <b id="instT">Add Flawed Hero to your home screen</b>
    <button class="x" id="instx" aria-label="Hide">&times;</button>
  </a>
  <section class="card" id="optin" hidden style="border-color:var(--gold)">
    <b>Stay in the loop, hero</b>
    <p class="muted">Get a buzz when something happens: your medals, replies to your ideas, news from the team. We won't spam you.</p>
    <div class="btns"><button class="btn" id="optYes">Yes, notify me</button><button class="btn ghost" id="optNo">Not now</button></div>
    <p class="note" id="optMsg" hidden></p>
  </section>
  <nav class="grid" id="grid" aria-label="Flawed Hero"></nav>
  <p class="ver" id="ver"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/push.js"></script>
<script>
// Splash: the poster holds for 3 seconds, once each time the app is opened
const splash = document.getElementById('splash');
let seen = false; try { seen = sessionStorage.getItem('fh.splash') === '1'; sessionStorage.setItem('fh.splash', '1'); } catch (e) {}
if (seen) splash.remove(); else setTimeout(() => { splash.classList.add('out'); setTimeout(() => splash.remove(), 450); }, 3000);

document.getElementById('grid').innerHTML = TILES.map((t, i) =>
  '<a class="tile' + (i === 0 ? ' first' : '') + '" data-tile="' + t.id + '" href="' + (t.href || 'soon.html?p=' + t.id) + '">' + svg(t.id) + '<b>' + t.name + '</b><span class="tdot" hidden></span></a>').join('');
document.getElementById('ver').textContent = 'v' + VERSION;

// Everyone must be signed in and approved; staff get the !, everyone gets the + and the bell
let meP = null;
async function staffDot(p) {
  if (!isStaff(p)) return;
  document.getElementById('adm').hidden = false;
  const c = t => sb.from(t).select('*', { count: 'exact', head: true }).eq('status', 'pending').then(r => r.count || 0);
  const all = await Promise.all([c('profiles'), c('results'), c('charities'), c('diary_events'), c('posts')]);
  let n = all.reduce((x, y) => x + y, 0);
  if (p.role === 'super') n += await c('marathon_entries');
  if (isAdmin(p)) { const { count: rc } = await sb.from('requests').select('id', { count: 'exact', head: true }).eq('status', 'suggested').eq('is_private', false); n += rc || 0; }
  const d = document.getElementById('dot'); d.textContent = n; d.hidden = !n;
}
// Bell number, a dot on each tile with something new, the + dot, and the badge on the phone's app icon
async function refreshHome() {
  const { data } = await sb.from('notifications').select('id, tile').is('read_at', null).limit(500);
  const rows = data || [], per = {};
  rows.forEach(r => { if (r.tile) per[r.tile] = (per[r.tile] || 0) + 1; });
  document.querySelectorAll('.tile').forEach(t => { const n = per[t.dataset.tile] || 0, d = t.querySelector('.tdot'); d.textContent = n; d.hidden = !n; });
  const bd = document.getElementById('bdot'); bd.textContent = rows.length > 99 ? '99+' : rows.length; bd.hidden = !rows.length;
  const q = per.queue || 0, plus = document.getElementById('plus');
  plus.querySelector('.dot') && plus.querySelector('.dot').remove();
  if (q) plus.insertAdjacentHTML('beforeend', '<span class="dot">' + q + '</span>');
  setAppBadge(rows.length);
  if (meP) staffDot(meP);
}
guard().then(p => {
  if (!p) return; meP = p;
  document.getElementById('plus').hidden = false;
  refreshHome();
  offerNotifications();
  // live while the app is open: new notifications arrive instantly; also re-check when you come back to it
  sb.channel('fh-n-' + p.user_id).on('postgres_changes', { event: '*', schema: 'public', table: 'notifications', filter: 'user_id=eq.' + p.user_id }, refreshHome).subscribe();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshHome(); });
  setInterval(() => { if (!document.hidden) refreshHome(); }, 60000);
});

// ---- Ask about notifications (needs a tap), and quietly re-connect if permission was already given ----
const OPT = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, put: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
async function offerNotifications() {
  const box = document.getElementById('optin');
  if (pushNeedsInstall()) { document.getElementById('instT').textContent = 'Add Flawed Hero to your home screen to get notifications'; return; }
  if (!pushSupported() || Notification.permission === 'denied') return;
  const sub = await currentSub();
  if (Notification.permission === 'granted') { if (!sub) enablePush(); return; }   // permission already given: just reconnect this phone
  const asked = +(OPT.get('fh.optAsked') || 0), next = +(OPT.get('fh.optNext') || 0);
  if (asked >= 4 || Date.now() < next) return;
  box.hidden = false;
}
document.getElementById('optYes').onclick = async () => {
  const b = document.getElementById('optYes'); b.disabled = true;
  const r = await enablePush();
  const m = document.getElementById('optMsg'); m.hidden = false;
  m.textContent = r === 'on' ? 'Brilliant. You\u2019re all set.' : r === 'denied' ? 'No problem. You can switch them on later in Settings.' : 'That didn\u2019t work this time. You can try again in Settings.';
  OPT.put('fh.optAsked', '9');
  setTimeout(() => { document.getElementById('optin').hidden = true; }, 2200);
};
document.getElementById('optNo').onclick = () => {
  OPT.put('fh.optAsked', String(+(OPT.get('fh.optAsked') || 0) + 1)); OPT.put('fh.optNext', String(Date.now() + 7 * 864e5));
  document.getElementById('optin').hidden = true;
};

const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
let hid = false; try { hid = localStorage.getItem('fh.instHidden') === '1'; } catch (e) {}
if (!standalone && !hid) document.getElementById('inst').hidden = false;
document.getElementById('instx').onclick = e => {
  e.preventDefault(); document.getElementById('inst').hidden = true;
  try { localStorage.setItem('fh.instHidden', '1'); } catch (err) {}
};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
