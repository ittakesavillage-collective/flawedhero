<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080D18">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>try{if(localStorage.getItem("fh.size")==="large")document.documentElement.dataset.size="large"}catch(e){}</script>
<title>Settings · Flawed Hero</title>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="back" href="./">&larr; Home</a>
  <h1>Settings</h1>
</div></header>
<main class="wrap">
  <section class="card"><b>Text size</b>
    <div class="seg" id="size"><button data-v="normal">Normal</button><button data-v="large">Large</button></div>
  </section>
  <section class="card"><div class="row"><b>Notifications on this phone</b><span class="chip" id="nstate"></span></div>
    <p class="note" id="nnote"></p>
    <div class="btns"><button class="btn" id="non" hidden>Turn on</button><button class="btn ghost" id="noff" hidden>Turn off</button><a class="btn" id="ninst" href="install.html" hidden>Add to home screen</a></div>
  </section>
  <section class="card"><b>Your account</b>
    <p class="muted" id="who">Signed in</p>
    <div class="btns"><button class="btn ghost" id="out">Sign out</button></div>
  </section>
  <section class="card">
    <div class="row"><span>Version</span><b id="ver"></b></div>
    <div class="btns"><button class="btn ghost" id="upd">Check for updates</button><a class="btn ghost" href="install.html">How to install</a></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/push.js"></script>
<script>
const root = document.documentElement;
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const put = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const box = document.getElementById('size');
const mark = v => box.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
mark(get('fh.size') || 'normal');
box.onclick = e => { const v = e.target.dataset.v; if (!v) return; put('fh.size', v); if (v === 'large') root.dataset.size = 'large'; else delete root.dataset.size; mark(v); };
document.getElementById('ver').textContent = 'v' + VERSION;
const N = id => document.getElementById(id);
async function drawPush() {
  ['non', 'noff', 'ninst'].forEach(id => N(id).hidden = true);
  if (pushNeedsInstall()) { N('nstate').textContent = 'Off'; N('nnote').textContent = 'On iPhone, notifications work once Flawed Hero is on your home screen.'; N('ninst').hidden = false; return; }
  if (!pushSupported()) { N('nstate').textContent = 'Not available'; N('nnote').textContent = 'This browser can\u2019t show notifications. You\u2019ll still see them inside the app.'; return; }
  if (Notification.permission === 'denied') { N('nstate').textContent = 'Blocked'; N('nnote').textContent = 'Notifications are blocked for Flawed Hero. Allow them in your phone\u2019s settings, then come back here.'; return; }
  const on = !!(await currentSub()) && Notification.permission === 'granted';
  N('nstate').textContent = on ? 'On' : 'Off';
  N('nnote').textContent = on ? 'You\u2019ll get a buzz on this phone when something needs you. They also always appear in the app under the bell.' : 'Get a buzz on this phone when something happens. They also always appear in the app under the bell.';
  N(on ? 'noff' : 'non').hidden = false;
}
N('non').onclick = async () => {
  N('non').disabled = true; const r = await enablePush(); N('non').disabled = false;
  if (r === 'error') N('nnote').textContent = 'That didn\u2019t work. Check your signal and try again.'; else drawPush();
};
N('noff').onclick = async () => { N('noff').disabled = true; await disablePush(); N('noff').disabled = false; drawPush(); };
drawPush();
currentUser().then(u => { if (u) document.getElementById('who').textContent = 'Signed in as ' + u.email; });
document.getElementById('out').onclick = async () => { await sb.auth.signOut(); location.replace('login.html'); };
document.getElementById('upd').onclick = async () => {
  try { const r = await navigator.serviceWorker.getRegistration(); if (r) await r.update(); } catch (e) {}
  location.reload();
};
</script>
</body>
</html>
