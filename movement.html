<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080D18">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>try{if(localStorage.getItem("fh.size")==="large")document.documentElement.dataset.size="large"}catch(e){}</script>
<title>My Movement · Flawed Hero</title>
<style>
.big{border-color:var(--bronze);background:linear-gradient(160deg,#2A1814,var(--surface) 60%)}
.num{font-family:var(--head);font-size:52px;line-height:1;color:var(--gold)}
.num small{font-size:20px;color:var(--muted)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mv{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--ink);cursor:pointer;font-weight:600}
.mv:active{transform:scale(.97)}
.mv svg{width:34px;height:34px;color:var(--gold)}
.mv.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:36px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.ent{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ent:first-child{border-top:0}
.ent svg{width:26px;height:26px;color:var(--gold);flex:none}
.ent .m{flex:1;min-width:0}
.ent b{font-family:var(--head);font-size:1.15em}
.ent button{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;padding:4px 8px}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tot b{display:block;font-family:var(--head);font-size:22px;color:var(--gold)}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="back" href="./">&larr; Home</a>
  <h1>My Movement</h1>
</div></header>
<main class="wrap">
  <section class="card big">
    <div class="row"><span class="muted">This month</span><div class="seg" id="view" style="min-width:190px"><button data-v="km">Distance</button><button data-v="min">Time</button></div></div>
    <div class="num" id="month">0 <small>km</small></div>
    <p class="note" id="comm"></p>
  </section>

  <section class="card">
    <b>I moved!</b>
    <div class="three" id="kinds"></div>
    <form id="form" hidden style="display:flex;flex-direction:column;gap:12px">
      <div id="sportBox" hidden style="display:none;flex-direction:column;gap:10px">
        <b>Which sport or exercise?</b>
        <div class="chips" id="sports"></div>
        <input type="text" id="sportOther" maxlength="40" placeholder="Type the sport or exercise" hidden>
      </div>
      <div id="kmBox" style="display:flex;flex-direction:column;gap:12px">
        <label class="f"><span id="klabel">Distance (km)</span><input type="number" id="km" step="0.01" min="0.01" max="1000" inputmode="decimal" required></label>
        <div class="chips" id="quick"></div>
      </div>
      <label class="f">When<input type="date" id="date" required></label>
      <label class="f"><span id="mlabel">How long? (minutes, optional)</span><input type="number" id="mins" min="1" max="3000" inputmode="numeric"></label>
      <label class="f">A note (optional)<input type="text" id="note" maxlength="100" placeholder="e.g. the Sunday Paddle"></label>
      <div class="btns"><button class="btn" id="save">Add it</button><button type="button" class="btn ghost" id="cancel">Cancel</button></div>
      <p class="err" id="msg" hidden></p>
    </form>
  </section>

  <section class="card"><b>Your totals</b><div class="tot" id="tot"></div></section>

  <section class="card"><b>Recent movement</b><div id="list"><p class="ph">Loading...</p></div></section>
  <p class="note">A simple log for now. Connecting Strava and other apps is being looked at.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script>
const $ = id => document.getElementById(id);
const I = {
  walk:'<path d="M13 4.5a1.8 1.8 0 1 0 .01 0M9 21l2-6-2.5-2.5 1.5-5 4 1 2 3 3 1M11 15l3 2.5 1 3.500"/>',
  run:'<circle cx="15" cy="4.500" r="2"/><path d="M9 21l2.500-6-3-2.500 2-4.500 3.500 2 2.500 3M13 14l2 4.500 3 .5M8 8.500l-3 2"/>',
  bike:'<circle cx="6" cy="16" r="3.500"/><circle cx="18" cy="16" r="3.500"/><path d="M6 16l4-8h5l3 8M10 8l5 8M9 5h3"/>',
  swim:'<circle cx="16" cy="6" r="1.800"/><path d="M3 18c1.500 0 1.500 1 3 1s1.500-1 3-1 1.500 1 3 1 1.500-1 3-1 1.500 1 3 1 1.500-1 3-1M4 13l5-3 3 2 3-3 3 2"/>',
  sport:'<circle cx="12" cy="12" r="8.500"/><path d="M12 3.500c2.500 2.500 2.500 14.500 0 17M12 3.500c-2.500 2.500-2.500 14.500 0 17M3.500 12h17"/>',
  other:'<path d="M12 3l2.600 5.400 5.900.8-4.300 4.100 1 5.900L12 16.500 6.800 19.200l1-5.900L3.500 9.200l5.900-.8z"/>'
};
const ic = k => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + I[k] + '</svg>';
const NAME = { walk: 'Walk', run: 'Run', bike: 'Bike', swim: 'Swim', sport: 'Sport', other: 'Other' };
const SPORTS = ['Paddle', 'Squash', 'Racketball', 'Tennis', 'Football', 'Gym', 'Yoga', 'Other sport'];
let sportPick = null, view = 'km';
try { view = localStorage.getItem('fh.moveView') === 'min' ? 'min' : 'km'; } catch (e) {}
// minutes shown as "5 h 20 min" once they pass an hour
const MINS = n => { n = Math.round(n); return n >= 60 ? Math.floor(n / 60).toLocaleString('en-GB') + ' h ' + (n % 60) + ' min' : n + ' min'; };
const KM = n => (Math.round(n * 10) / 10).toLocaleString('en-GB');
const QUICK = [['5K', 5], ['10K', 10], ['Half', 21.1], ['Marathon', 42.2]];
let me = null, kind = null, rows = [];
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

$('kinds').innerHTML = ['walk', 'run', 'bike'].map(k => '<button class="mv" data-k="' + k + '">' + ic(k) + NAME[k] + '</button>').join('') +
  ['swim', 'sport', 'other'].map(k => '<button class="mv" data-k="' + k + '">' + ic(k) + NAME[k] + '</button>').join('');
$('kinds').style.gridTemplateColumns = 'repeat(3,1fr)';
$('quick').innerHTML = QUICK.map(q => '<button type="button" data-km="' + q[1] + '">' + q[0] + '</button>').join('');

$('sports').innerHTML = SPORTS.map(s => '<button type="button" data-s="' + s + '">' + s + '</button>').join('');
$('sports').onclick = e => {
  const b = e.target.closest('[data-s]'); if (!b) return;
  sportPick = b.dataset.s;
  document.querySelectorAll('#sports button').forEach(x => x.style.borderColor = x === b ? 'var(--gold)' : '');
  $('sportOther').hidden = sportPick !== 'Other sport'; if (!$('sportOther').hidden) $('sportOther').focus();
};
$('kinds').onclick = e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  kind = b.dataset.k; sportPick = null;
  document.querySelectorAll('.mv').forEach(x => x.classList.toggle('on', x === b));
  const sp = kind === 'sport';
  $('sportBox').style.display = sp ? 'flex' : 'none'; $('sportOther').hidden = true;
  document.querySelectorAll('#sports button').forEach(x => x.style.borderColor = '');
  $('kmBox').style.display = sp ? 'none' : 'flex'; $('km').required = !sp; $('mins').required = sp;
  $('mlabel').textContent = sp ? 'How long? (minutes)' : 'How long? (minutes, optional)';
  $('form').hidden = false; $('date').value = todayStr(); $('klabel').textContent = NAME[kind] + ' distance (km)';
  (sp ? $('mins') : $('km')).focus();
};
$('quick').onclick = e => { const b = e.target.closest('[data-km]'); if (b) $('km').value = b.dataset.km; };
$('cancel').onclick = () => { $('form').hidden = true; kind = null; document.querySelectorAll('.mv').forEach(x => x.classList.remove('on')); };

$('form').onsubmit = async e => {
  e.preventDefault(); $('save').disabled = true; $('msg').hidden = true;
  const sp = kind === 'sport';
  const name = sp ? (sportPick === 'Other sport' ? $('sportOther').value.trim() : sportPick) : null;
  if (sp && !name) { $('save').disabled = false; $('msg').textContent = 'Please pick the sport or exercise.'; $('msg').hidden = false; return; }
  const row = { kind, km: sp ? null : +$('km').value, sport: name, moved_on: $('date').value, minutes: $('mins').value ? +$('mins').value : null, note: $('note').value.trim() || null };
  const { error } = await sb.from('movements').insert(row);
  $('save').disabled = false;
  if (error) { $('msg').textContent = 'Couldn’t save: ' + error.message; $('msg').hidden = false; return; }
  $('form').reset(); $('form').hidden = true; kind = null; document.querySelectorAll('.mv').forEach(x => x.classList.remove('on'));
  load();
};
$('list').onclick = async e => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  if (!confirm('Delete this one?')) return;
  const { error } = await sb.from('movements').delete().eq('id', +b.dataset.del);
  if (error) return alert(error.message);
  load();
};

const markView = () => document.querySelectorAll('#view button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === view));
$('view').onclick = e => { const v = e.target.dataset.v; if (!v) return; view = v; try { localStorage.setItem('fh.moveView', v); } catch (err) {} markView(); draw(); };
let comm = null;
function draw() {
  const km = view === 'km', ym = todayStr().slice(0, 7);
  const val = r => km ? Number(r.km || 0) : Number(r.minutes || 0);
  const fmt = n => km ? KM(n) + ' km' : MINS(n);
  const month = rows.filter(r => r.moved_on.slice(0, 7) === ym).reduce((a, r) => a + val(r), 0);
  $('month').innerHTML = km ? KM(month) + ' <small>km</small>' : MINS(month).replace(/(\d+) (h|min)/g, '$1 <small>$2</small>');
  const t = {}; rows.forEach(r => t[r.kind] = (t[r.kind] || 0) + val(r));
  const all = rows.reduce((a, r) => a + val(r), 0);
  const parts = [['All time', all], ['Walk', t.walk || 0], ['Run', t.run || 0], ['Bike', t.bike || 0], ['Swim', t.swim || 0]];
  if (!km) parts.push(['Sport', t.sport || 0]);
  parts.push(['Other', t.other || 0]);
  $('tot').innerHTML = parts.map(x => '<div><b>' + (km ? KM(x[1]) : MINS(x[1])) + '</b><small class="muted">' + x[0] + (km ? ' km' : '') + '</small></div>').join('');
  const total = comm ? Number(km ? comm.total_km : comm.total_minutes) : 0;
  $('comm').textContent = total > 0 ? 'Together, our heroes have ' + (km ? 'moved ' + KM(total) + ' km.' : 'been active for ' + MINS(total) + '.') : 'Add your first movement and start the count.';
  $('list').innerHTML = rows.length ? rows.slice(0, 30).map(r =>
    '<div class="ent">' + ic(r.kind) + '<div class="m">' + (r.kind === 'sport' ? '<b>' + esc(r.sport || 'Sport') + '</b> ' + (r.minutes ? MINS(r.minutes) : '') :
      '<b>' + KM(Number(r.km)) + ' km</b> ' + NAME[r.kind].toLowerCase()) +
    '<br><small class="muted">' + new Date(r.moved_on + 'T12:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) +
    (r.kind !== 'sport' && r.minutes ? ' &middot; ' + MINS(r.minutes) : '') + (r.note ? ' &middot; ' + esc(r.note) : '') + '</small></div>' +
    '<button data-del="' + r.id + '" aria-label="Delete">&times;</button></div>').join('')
    : '<p class="ph">Nothing yet. Tap Walk, Run, Bike or Sport above.</p>';
}
async function load() {
  const [m, c] = await Promise.all([sb.from('movements').select('*').order('moved_on', { ascending: false }).order('created_at', { ascending: false }).limit(2000), sb.rpc('community_movement')]);
  if (m.error) { $('list').innerHTML = '<p class="err">Couldn\u2019t load your movement. Check your signal and try again.</p>'; return; }
  rows = m.data; comm = c.data && c.data[0] || null; markView(); draw();
}
guard().then(p => { if (!p) return; me = p; load(); });
</script>
</body>
</html>
